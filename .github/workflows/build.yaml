name: 构建

# 推 main 时三平台各打一次包，用来尽早暴露某个平台特有的构建问题；
# 打 tag（形如 v1.0.0）时额外把产物发成 Release；
# 也可以在 Actions 页面手动触发。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了不要连累另外两个，先把能出的产物出出来
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: windows-x86_64
            os: windows-latest
          - target: macos-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 三平台都有现成的 PyQt6 与 pywinpty wheel，不用现场编译
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # 这两个自检是纯函数，不联网、不需要 ncmctl 在场，正好用来卡住
      # 「命令构建层被改坏了」这类问题
      - name: 离线自检
        run: |
          python -m ncmgui.ncmctl
          python -m ncmgui.resolver

      - name: 打包
        env:
          NCMGUI_BUILD_NAME: ncmctl-gui-${{ matrix.target }}
        run: pyinstaller ncmctl-gui.spec --noconfirm

      # 这一条是专门给 Windows 兜底的。pywinpty 除了 Python 扩展之外还带几个
      # 非 .pyd 的二进制，PyInstaller 的常规依赖分析看不到它们，全靠 spec 里那句
      # collect_all("winpty")。而 collect_all 找不到包时只警告不报错 —— 少了
      # conpty.dll，打包照样「成功」，用户那边却一开下载就报错。这个平台本地
      # 又测不了，所以让 CI 把产物拆开点名清点。
      - name: 清点 Windows 产物里的 ConPTY 运行时
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          pyi-archive_viewer -l $exe.FullName > toc.txt
          foreach ($name in 'conpty.dll', 'OpenConsole.exe', 'winpty.dll', 'winpty-agent.exe') {
            if (-not (Select-String -Path toc.txt -SimpleMatch -Pattern $name -Quiet)) {
              throw "产物里没有 $name —— pywinpty 的运行时二进制没被打进去"
            }
          }
          Write-Host "ConPTY 运行时齐全：$($exe.Name)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ncmctl-gui-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      # gh release create --generate-notes 要读提交历史来生成说明，但
      # download-artifact 只搬产物、不会把仓库带下来，缺了这步 gh 会在空目录里
      # 报 "not a git repository"。fetch-depth: 0 是为了拿到完整历史 —— 默认的
      # 浅克隆只有最近一次提交，生成出来的说明会缺东西。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          # 产物名已经带了平台后缀，合并到一处不会互相覆盖
          path: dist
          merge-multiple: true

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
